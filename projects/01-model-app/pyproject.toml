[project]
name = "signal"
version = "0.1.0"
description = "Signal — stage 1: one model call, done properly"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "httpx2>=2",  # openai's HTTP layer; used to script provider responses in tests
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
signal = "signal_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
